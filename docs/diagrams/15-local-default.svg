<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="796" viewBox="0 0 1280 796" role="img" aria-labelledby="title description" font-family="Arial, Microsoft YaHei, sans-serif"><title id="title">局域网与最终兜底 · 完整规则</title><desc id="description">9 条规则；编号对应实际首匹配顺序；大括号只表示结构包含。从左向右的大括号表示整体与局部的包含关系。</desc><rect x="0" y="0" width="1280" height="796" fill="#ffffff" /><text x="28" y="32" fill="#172033" font-size="23" font-weight="600">局域网与最终兜底 · 完整规则</text><text x="28" y="58" fill="#475569" font-size="14" font-weight="400">9 条规则；编号对应实际首匹配顺序；大括号只表示结构包含</text><text x="28" y="91" fill="#64748b" font-size="13" font-weight="400">整体</text><text x="208" y="91" fill="#64748b" font-size="13" font-weight="400">分类 / 服务组</text><text x="458" y="91" fill="#64748b" font-size="13" font-weight="400">结构拆解</text><text x="644" y="91" fill="#64748b" font-size="13" font-weight="400">完整规则 / 设计理由</text><g data-depth="0"><text x="28" y="441.0" fill="#2563eb" font-size="17" font-weight="600">局域网与最终兜底</text><path d="M 198 114.0 Q 187 114.0 187 126.0 L 187 429.0 Q 187 441.0 180 441.0 Q 187 441.0 187 453.0 L 187 756.0 Q 187 768.0 198 768.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="1"><text x="208" y="366.0" fill="#2563eb" font-size="17" font-weight="600">DIRECT</text><text x="208" y="388.0" fill="#475569" font-size="15" font-weight="400">DIRECT：不经过机场候选</text><path d="M 444 114.0 Q 433 114.0 433 126.0 L 433 365.0 Q 433 377.0 426 377.0 Q 433 377.0 433 389.0 L 433 628.0 Q 433 640.0 444 640.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="2"><text x="458" y="129.0" fill="#2563eb" font-size="17" font-weight="600">设计理由</text><path d="M 630 114.0 Q 619 114.0 619 120.0 L 619 123.0 Q 619 129.0 612 129.0 Q 619 129.0 619 135.0 L 619 138.0 Q 619 144.0 630 144.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3"><text x="644" y="129.0" fill="#172033" font-size="15" font-weight="600">回环、局域网与明确国内域名直连，减少绕行与订阅计费。</text></g></g><g data-depth="2"><text x="458" y="293.0" fill="#2563eb" font-size="17" font-weight="600">IPv4 网段 · 5 条</text><text x="458" y="315.0" fill="#475569" font-size="15" font-weight="400">IP-CIDR</text><path d="M 630 154.0 Q 619 154.0 619 166.0 L 619 292.0 Q 619 304.0 612 304.0 Q 619 304.0 619 316.0 L 619 442.0 Q 619 454.0 630 454.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3" data-rule-index="1" data-rule="IP-CIDR,127.0.0.0/8,DIRECT,no-resolve"><title>IP-CIDR,127.0.0.0/8,DIRECT,no-resolve</title><text x="644" y="169.0" fill="#172033" font-size="15" font-weight="600">#001 127.0.0.0/8</text><text x="644" y="191.0" fill="#475569" font-size="15" font-weight="400">理由：回环或局域网直连；no-resolve 不主动解析。</text></g><g data-depth="3" data-rule-index="2" data-rule="IP-CIDR,10.0.0.0/8,DIRECT,no-resolve"><title>IP-CIDR,10.0.0.0/8,DIRECT,no-resolve</title><text x="644" y="231.0" fill="#172033" font-size="15" font-weight="600">#002 10.0.0.0/8</text><text x="644" y="253.0" fill="#475569" font-size="15" font-weight="400">理由：回环或局域网直连；no-resolve 不主动解析。</text></g><g data-depth="3" data-rule-index="3" data-rule="IP-CIDR,172.16.0.0/12,DIRECT,no-resolve"><title>IP-CIDR,172.16.0.0/12,DIRECT,no-resolve</title><text x="644" y="293.0" fill="#172033" font-size="15" font-weight="600">#003 172.16.0.0/12</text><text x="644" y="315.0" fill="#475569" font-size="15" font-weight="400">理由：回环或局域网直连；no-resolve 不主动解析。</text></g><g data-depth="3" data-rule-index="4" data-rule="IP-CIDR,192.168.0.0/16,DIRECT,no-resolve"><title>IP-CIDR,192.168.0.0/16,DIRECT,no-resolve</title><text x="644" y="355.0" fill="#172033" font-size="15" font-weight="600">#004 192.168.0.0/16</text><text x="644" y="377.0" fill="#475569" font-size="15" font-weight="400">理由：回环或局域网直连；no-resolve 不主动解析。</text></g><g data-depth="3" data-rule-index="5" data-rule="IP-CIDR,169.254.0.0/16,DIRECT,no-resolve"><title>IP-CIDR,169.254.0.0/16,DIRECT,no-resolve</title><text x="644" y="417.0" fill="#172033" font-size="15" font-weight="600">#005 169.254.0.0/16</text><text x="644" y="439.0" fill="#475569" font-size="15" font-weight="400">理由：回环或局域网直连；no-resolve 不主动解析。</text></g></g><g data-depth="2"><text x="458" y="541.0" fill="#2563eb" font-size="17" font-weight="600">IPv6 网段 · 3 条</text><text x="458" y="563.0" fill="#475569" font-size="15" font-weight="400">IP-CIDR6</text><path d="M 630 464.0 Q 619 464.0 619 476.0 L 619 540.0 Q 619 552.0 612 552.0 Q 619 552.0 619 564.0 L 619 628.0 Q 619 640.0 630 640.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3" data-rule-index="6" data-rule="IP-CIDR6,::1/128,DIRECT,no-resolve"><title>IP-CIDR6,::1/128,DIRECT,no-resolve</title><text x="644" y="479.0" fill="#172033" font-size="15" font-weight="600">#006 ::1/128</text><text x="644" y="501.0" fill="#475569" font-size="15" font-weight="400">理由：IPv6 回环或局域网直连；no-resolve。</text></g><g data-depth="3" data-rule-index="7" data-rule="IP-CIDR6,fc00::/7,DIRECT,no-resolve"><title>IP-CIDR6,fc00::/7,DIRECT,no-resolve</title><text x="644" y="541.0" fill="#172033" font-size="15" font-weight="600">#007 fc00::/7</text><text x="644" y="563.0" fill="#475569" font-size="15" font-weight="400">理由：IPv6 回环或局域网直连；no-resolve。</text></g><g data-depth="3" data-rule-index="8" data-rule="IP-CIDR6,fe80::/10,DIRECT,no-resolve"><title>IP-CIDR6,fe80::/10,DIRECT,no-resolve</title><text x="644" y="603.0" fill="#172033" font-size="15" font-weight="600">#008 fe80::/10</text><text x="644" y="625.0" fill="#475569" font-size="15" font-weight="400">理由：IPv6 回环或局域网直连；no-resolve。</text></g></g></g><g data-depth="1"><text x="208" y="665.0" fill="#2563eb" font-size="17" font-weight="600">通用海外</text><text x="208" y="687.0" fill="#475569" font-size="15" font-weight="400">bulk 优先；primary 低倍率</text><text x="208" y="709.0" fill="#475569" font-size="15" font-weight="400">备用</text><text x="208" y="731.0" fill="#475569" font-size="15" font-weight="400">已验收；倍率 ≤ 1</text><text x="208" y="753.0" fill="#475569" font-size="15" font-weight="400">roles: interactive</text><path d="M 444 663.0 Q 433 663.0 433 675.0 L 433 697.0 Q 433 709.0 426 709.0 Q 433 709.0 433 721.0 L 433 743.0 Q 433 755.0 444 755.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="2"><text x="458" y="678.0" fill="#2563eb" font-size="17" font-weight="600">设计理由</text><path d="M 630 663.0 Q 619 663.0 619 669.0 L 619 672.0 Q 619 678.0 612 678.0 Q 619 678.0 619 684.0 L 619 687.0 Q 619 693.0 630 693.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3"><text x="644" y="678.0" fill="#172033" font-size="15" font-weight="600">未命中请求最终兜底；重要新业务应补专属规则与验收。</text></g></g><g data-depth="2"><text x="458" y="718.0" fill="#2563eb" font-size="17" font-weight="600">最终兜底 · 1 条</text><text x="458" y="740.0" fill="#475569" font-size="15" font-weight="400">MATCH</text><path d="M 630 703.0 Q 619 703.0 619 713.4 L 619 718.6 Q 619 729.0 612 729.0 Q 619 729.0 619 739.4 L 619 744.6 Q 619 755.0 630 755.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3" data-rule-index="185" data-rule="MATCH,通用海外"><title>MATCH,通用海外</title><text x="644" y="718.0" fill="#172033" font-size="15" font-weight="600">#185 所有未命中请求</text><text x="644" y="740.0" fill="#475569" font-size="15" font-weight="400">理由：前面所有规则均未命中时采用通用海外。</text></g></g></g></g></svg>

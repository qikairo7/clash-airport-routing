<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1226" viewBox="0 0 1280 1226" role="img" aria-labelledby="title description" font-family="Arial, Microsoft YaHei, sans-serif"><title id="title">容器与依赖 · 精确主机 · 完整规则</title><desc id="description">17 条规则；编号对应实际首匹配顺序；大括号只表示结构包含。从左向右的大括号表示整体与局部的包含关系。</desc><rect x="0" y="0" width="1280" height="1226" fill="#ffffff" /><text x="28" y="32" fill="#172033" font-size="23" font-weight="600">容器与依赖 · 精确主机 · 完整规则</text><text x="28" y="58" fill="#475569" font-size="14" font-weight="400">17 条规则；编号对应实际首匹配顺序；大括号只表示结构包含</text><text x="28" y="91" fill="#64748b" font-size="13" font-weight="400">整体</text><text x="208" y="91" fill="#64748b" font-size="13" font-weight="400">分类 / 服务组</text><text x="458" y="91" fill="#64748b" font-size="13" font-weight="400">结构拆解</text><text x="644" y="91" fill="#64748b" font-size="13" font-weight="400">完整规则 / 设计理由</text><g data-depth="0"><text x="28" y="645.0" fill="#2563eb" font-size="17" font-weight="600">容器与依赖 · 精确</text><text x="28" y="667.0" fill="#475569" font-size="15" font-weight="400">主机</text><path d="M 198 114.0 Q 187 114.0 187 126.0 L 187 644.0 Q 187 656.0 180 656.0 Q 187 656.0 187 668.0 L 187 1186.0 Q 187 1198.0 198 1198.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="1"><text x="208" y="623.0" fill="#2563eb" font-size="17" font-weight="600">容器与依赖</text><text x="208" y="645.0" fill="#475569" font-size="15" font-weight="400">仅 bulk 容量候选</text><text x="208" y="667.0" fill="#475569" font-size="15" font-weight="400">已验收；倍率 ≤ 1</text><text x="208" y="689.0" fill="#475569" font-size="15" font-weight="400">roles: bulk</text><path d="M 444 114.0 Q 433 114.0 433 126.0 L 433 644.0 Q 433 656.0 426 656.0 Q 433 656.0 433 668.0 L 433 1186.0 Q 433 1198.0 444 1198.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="2"><text x="458" y="129.0" fill="#2563eb" font-size="17" font-weight="600">设计理由</text><path d="M 630 114.0 Q 619 114.0 619 120.0 L 619 123.0 Q 619 129.0 612 129.0 Q 619 129.0 619 135.0 L 619 138.0 Q 619 144.0 630 144.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3"><text x="644" y="129.0" fill="#172033" font-size="15" font-weight="600">镜像、软件包、模型及更新文件采用容量来源；认证挑战另判。</text></g></g><g data-depth="2"><text x="458" y="665.0" fill="#2563eb" font-size="17" font-weight="600">精确域名 · 17 条</text><text x="458" y="687.0" fill="#475569" font-size="15" font-weight="400">DOMAIN</text><path d="M 630 154.0 Q 619 154.0 619 166.0 L 619 664.0 Q 619 676.0 612 676.0 Q 619 676.0 619 688.0 L 619 1186.0 Q 619 1198.0 630 1198.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3" data-rule-index="16" data-rule="DOMAIN,registry-1.docker.io,容器与依赖"><title>DOMAIN,registry-1.docker.io,容器与依赖</title><text x="644" y="169.0" fill="#172033" font-size="15" font-weight="600">#016 registry-1.docker.io</text><text x="644" y="191.0" fill="#475569" font-size="15" font-weight="400">理由：仅匹配此主机，位于普通父域之前。</text></g><g data-depth="3" data-rule-index="17" data-rule="DOMAIN,auth.docker.io,容器与依赖"><title>DOMAIN,auth.docker.io,容器与依赖</title><text x="644" y="231.0" fill="#172033" font-size="15" font-weight="600">#017 auth.docker.io</text><text x="644" y="253.0" fill="#475569" font-size="15" font-weight="400">理由：仅匹配此主机，位于普通父域之前。</text></g><g data-depth="3" data-rule-index="18" data-rule="DOMAIN,production.cloudflare.docker.com,容器与依赖"><title>DOMAIN,production.cloudflare.docker.com,容器与依赖</title><text x="644" y="293.0" fill="#172033" font-size="15" font-weight="600">#018 production.cloudflare.docker.com</text><text x="644" y="315.0" fill="#475569" font-size="15" font-weight="400">理由：仅匹配此主机，位于普通父域之前。</text></g><g data-depth="3" data-rule-index="19" data-rule="DOMAIN,docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com,容器与依赖"><title>DOMAIN,docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com,容器与依赖</title><text x="644" y="355.0" fill="#172033" font-size="15" font-weight="600">#019 docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com</text><text x="644" y="377.0" fill="#475569" font-size="15" font-weight="400">理由：仅 Docker 已知对象存储租户走容量，不扩大整个 R2 父域。</text></g><g data-depth="3" data-rule-index="20" data-rule="DOMAIN,registry.gitlab.com,容器与依赖"><title>DOMAIN,registry.gitlab.com,容器与依赖</title><text x="644" y="417.0" fill="#172033" font-size="15" font-weight="600">#020 registry.gitlab.com</text><text x="644" y="439.0" fill="#475569" font-size="15" font-weight="400">理由：镜像下载先于 gitlab.com 开发父域。</text></g><g data-depth="3" data-rule-index="21" data-rule="DOMAIN,mcr.microsoft.com,容器与依赖"><title>DOMAIN,mcr.microsoft.com,容器与依赖</title><text x="644" y="479.0" fill="#172033" font-size="15" font-weight="600">#021 mcr.microsoft.com</text><text x="644" y="501.0" fill="#475569" font-size="15" font-weight="400">理由：仅匹配此主机，位于普通父域之前。</text></g><g data-depth="3" data-rule-index="22" data-rule="DOMAIN,ghcr.io,容器与依赖"><title>DOMAIN,ghcr.io,容器与依赖</title><text x="644" y="541.0" fill="#172033" font-size="15" font-weight="600">#022 ghcr.io</text><text x="644" y="563.0" fill="#475569" font-size="15" font-weight="400">理由：仅匹配此主机，位于普通父域之前。</text></g><g data-depth="3" data-rule-index="23" data-rule="DOMAIN,pkg-containers.githubusercontent.com,容器与依赖"><title>DOMAIN,pkg-containers.githubusercontent.com,容器与依赖</title><text x="644" y="603.0" fill="#172033" font-size="15" font-weight="600">#023 pkg-containers.githubusercontent.com</text><text x="644" y="625.0" fill="#475569" font-size="15" font-weight="400">理由：仅匹配此主机，位于普通父域之前。</text></g><g data-depth="3" data-rule-index="24" data-rule="DOMAIN,registry.npmjs.org,容器与依赖"><title>DOMAIN,registry.npmjs.org,容器与依赖</title><text x="644" y="665.0" fill="#172033" font-size="15" font-weight="600">#024 registry.npmjs.org</text><text x="644" y="687.0" fill="#475569" font-size="15" font-weight="400">理由：仅匹配此主机，位于普通父域之前。</text></g><g data-depth="3" data-rule-index="25" data-rule="DOMAIN,registry.yarnpkg.com,容器与依赖"><title>DOMAIN,registry.yarnpkg.com,容器与依赖</title><text x="644" y="727.0" fill="#172033" font-size="15" font-weight="600">#025 registry.yarnpkg.com</text><text x="644" y="749.0" fill="#475569" font-size="15" font-weight="400">理由：仅匹配此主机，位于普通父域之前。</text></g><g data-depth="3" data-rule-index="26" data-rule="DOMAIN,pypi.org,容器与依赖"><title>DOMAIN,pypi.org,容器与依赖</title><text x="644" y="789.0" fill="#172033" font-size="15" font-weight="600">#026 pypi.org</text><text x="644" y="811.0" fill="#475569" font-size="15" font-weight="400">理由：仅匹配此主机，位于普通父域之前。</text></g><g data-depth="3" data-rule-index="27" data-rule="DOMAIN,files.pythonhosted.org,容器与依赖"><title>DOMAIN,files.pythonhosted.org,容器与依赖</title><text x="644" y="851.0" fill="#172033" font-size="15" font-weight="600">#027 files.pythonhosted.org</text><text x="644" y="873.0" fill="#475569" font-size="15" font-weight="400">理由：仅匹配此主机，位于普通父域之前。</text></g><g data-depth="3" data-rule-index="28" data-rule="DOMAIN,update.code.visualstudio.com,容器与依赖"><title>DOMAIN,update.code.visualstudio.com,容器与依赖</title><text x="644" y="913.0" fill="#172033" font-size="15" font-weight="600">#028 update.code.visualstudio.com</text><text x="644" y="935.0" fill="#475569" font-size="15" font-weight="400">理由：仅匹配此主机，位于普通父域之前。</text></g><g data-depth="3" data-rule-index="29" data-rule="DOMAIN,download.jetbrains.com,容器与依赖"><title>DOMAIN,download.jetbrains.com,容器与依赖</title><text x="644" y="975.0" fill="#172033" font-size="15" font-weight="600">#029 download.jetbrains.com</text><text x="644" y="997.0" fill="#475569" font-size="15" font-weight="400">理由：IDE 安装包先于 jetbrains.com 开发父域。</text></g><g data-depth="3" data-rule-index="30" data-rule="DOMAIN,download-cdn.jetbrains.com,容器与依赖"><title>DOMAIN,download-cdn.jetbrains.com,容器与依赖</title><text x="644" y="1037.0" fill="#172033" font-size="15" font-weight="600">#030 download-cdn.jetbrains.com</text><text x="644" y="1059.0" fill="#475569" font-size="15" font-weight="400">理由：IDE 分发
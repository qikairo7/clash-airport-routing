<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="676" viewBox="0 0 1280 676" role="img" aria-labelledby="title description" font-family="Arial, Microsoft YaHei, sans-serif"><title id="title">多订阅分流 · 单向括号总览</title><desc id="description">公开模板 185 条规则；从整体拆解到分类、部分与设计理由。从左向右的大括号表示整体与局部的包含关系。</desc><rect x="0" y="0" width="1280" height="676" fill="#ffffff" /><text x="28" y="32" fill="#172033" font-size="23" font-weight="600">多订阅分流 · 单向括号总览</text><text x="28" y="58" fill="#475569" font-size="14" font-weight="400">公开模板 185 条规则；从整体拆解到分类、部分与设计理由</text><text x="28" y="91" fill="#64748b" font-size="13" font-weight="400">整体</text><text x="208" y="91" fill="#64748b" font-size="13" font-weight="400">分类 / 服务组</text><text x="458" y="91" fill="#64748b" font-size="13" font-weight="400">结构拆解</text><text x="644" y="91" fill="#64748b" font-size="13" font-weight="400">完整规则 / 设计理由</text><g data-depth="0"><text x="28" y="381.0" fill="#2563eb" font-size="17" font-weight="600">多订阅分流</text><path d="M 198 114.0 Q 187 114.0 187 126.0 L 187 369.0 Q 187 381.0 180 381.0 Q 187 381.0 187 393.0 L 187 636.0 Q 187 648.0 198 648.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="1"><text x="208" y="171.0" fill="#2563eb" font-size="17" font-weight="600">AI · 30 个服务组</text><path d="M 444 114.0 Q 433 114.0 433 126.0 L 433 159.0 Q 433 171.0 426 171.0 Q 433 171.0 433 183.0 L 433 216.0 Q 433 228.0 444 228.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="2"><text x="458" y="129.0" fill="#2563eb" font-size="17" font-weight="600">23 个自动</text><text x="458" y="151.0" fill="#475569" font-size="15" font-weight="400">7 个手动</text><path d="M 630 114.0 Q 619 114.0 619 124.4 L 619 129.6 Q 619 140.0 612 140.0 Q 619 140.0 619 150.4 L 619 155.6 Q 619 166.0 630 166.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3"><text x="644" y="129.0" fill="#172033" font-size="15" font-weight="600">按服务取得资格；倍率不超过 1。</text><text x="644" y="151.0" fill="#475569" font-size="15" font-weight="400">primary 优先，bulk 逐服务合格候选备用。</text></g></g><g data-depth="2"><text x="458" y="202.0" fill="#2563eb" font-size="17" font-weight="600">专属资源与认证</text><path d="M 630 176.0 Q 619 176.0 619 186.4 L 619 191.6 Q 619 202.0 612 202.0 Q 619 202.0 619 212.4 L 619 217.6 Q 619 228.0 630 228.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3"><text x="644" y="191.0" fill="#172033" font-size="15" font-weight="600">精确主机和服务父域分别列出。</text><text x="644" y="213.0" fill="#475569" font-size="15" font-weight="400">共享身份主机按实际业务复测。</text></g></g></g><g data-depth="1"><text x="208" y="275.0" fill="#2563eb" font-size="17" font-weight="600">互动 · 5 个组</text><path d="M 444 238.0 Q 433 238.0 433 250.0 L 433 263.0 Q 433 275.0 426 275.0 Q 433 275.0 433 287.0 L 433 300.0 Q 433 312.0 444 312.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="2"><text x="458" y="253.0" fill="#2563eb" font-size="17" font-weight="600">开发 / GitHub API</text><text x="458" y="275.0" fill="#475569" font-size="15" font-weight="400">社交 / Telegram</text><text x="458" y="297.0" fill="#475569" font-size="15" font-weight="400">通用海外</text><path d="M 630 249.0 Q 619 249.0 619 259.4 L 619 264.6 Q 619 275.0 612 275.0 Q 619 275.0 619 285.4 L 619 290.6 Q 619 301.0 630 301.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3"><text x="644" y="264.0" fill="#172033" font-size="15" font-weight="600">bulk 优先；primary 低倍率备用。</text><text x="644" y="286.0" fill="#475569" font-size="15" font-weight="400">重视互动响应与业务连通；API 状态另判。</text></g></g></g><g data-depth="1"><text x="208" y="359.0" fill="#2563eb" font-size="17" font-weight="600">容量 · 3 个组</text><path d="M 444 322.0 Q 433 322.0 433 334.0 L 433 347.0 Q 433 359.0 426 359.0 Q 433 359.0 433 371.0 L 433 384.0 Q 433 396.0 444 396.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="2"><text x="458" y="337.0" fill="#2563eb" font-size="17" font-weight="600">GitHub 文件</text><text x="458" y="359.0" fill="#475569" font-size="15" font-weight="400">容器与依赖</text><text x="458" y="381.0" fill="#475569" font-size="15" font-weight="400">媒体与下载</text><path d="M 630 333.0 Q 619 333.0 619 343.4 L 619 348.6 Q 619 359.0 612 359.0 Q 619 359.0 619 369.4 L 619 374.6 Q 619 385.0 630 385.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3"><text x="644" y="348.0" fill="#172033" font-size="15" font-weight="600">仅 bulk 自动候选，控制主订阅消耗。</text><text x="644" y="370.0" fill="#475569" font-size="15" font-weight="400">精确下载主机先于 AI 和普通父域。</text></g></g></g><g data-depth="1"><text x="208" y="432.0" fill="#2563eb" font-size="17" font-weight="600">DIRECT</text><path d="M 444 406.0 Q 433 406.0 433 416.4 L 433 421.6 Q 433 432.0 426 432.0 Q 433 432.0 433 442.4 L 433 447.6 Q 433 458.0 444 458.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="2"><text x="458" y="421.0" fill="#2563eb" font-size="17" font-weight="600">国内域名</text><text x="458" y="443.0" fill="#475569" font-size="15" font-weight="400">回环与局域网</text><path d="M 630 406.0 Q 619 406.0 619 416.4 L 619 421.6 Q 619 432.0 612 432.0 Q 619 432.0 619 442.4 L 619 447.6 Q 619 458.0 630 458.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3"><text x="644" y="421.0" fill="#172033" font-size="15" font-weight="600">明确匹配才直连；保留本机网络访问。</text><text x="644" y="443.0" fill="#475569" font-size="15" font-weight="400">公开模板没有完整国内 IP 规则库。</text></g></g></g><g data-depth="1"><text x="208" y="494.0" fill="#2563eb" font-size="17" font-weight="600">全部节点目录</text><path d="M 444 468.0 Q 433 468.0 433 478.4 L 433 483.6 Q 433 494.0 426 494.0 Q 433 494.0 433 504.4 L 433 509.6 Q 433 520.0 444 520.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="2"><text x="458" y="483.0" fill="#2563eb" font-size="17" font-weight="600">primary / bulk</text><text x="458" y="505.0" fill="#475569" font-size="15" font-weight="400">temporary</text><path d="M 630 468.0 Q 619 468.0 619 478.4 L 619 483.6 Q 619 494.0 612 494.0 Q 619 494.0 619 504.4 L 619 509.6 Q 619 520.0 630 520.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3"><text x="644" y="483.0" fill="#172033" font-size="15" font-weight="600">保留高倍率、未验收和临时节点的手动入口。</text><text x="644" y="505.0" fill="#475569" font-size="15" font-weight="400">选择目录不自动改变既有业务组选路。</text></g></g></g><g data-depth="1"><text x="208" y="589.0" fill="#2563eb" font-size="17" font-weight="600">规则首匹配</text><path d="M 444 530.0 Q 433 530.0 433 542.0 L 433 577.0 Q 433 589.0 426 589.0 Q 433 589.0 433 601.0 L 433 636.0 Q 433 648.0 444 648.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="2"><text x="458" y="545.0" fill="#2563eb" font-size="17" font-weight="600">局域网先匹配</text><text x="458" y="567.0" fill="#475569" font-size="15" font-weight="400">精确普通主机</text><text x="458" y="589.0" fill="#475569" font-size="15" font-weight="400">AI 主机与父域</text><text x="458" y="611.0" fill="#475569" font-size="15" font-weight="400">普通与国内后缀</text><text x="458" y="633.0" fill="#475569" font-size="15" font-weight="400">最终 MATCH</text><path d="M 630 563.0 Q 619 563.0 619 573.4 L 619 578.6 Q 619 589.0 612 589.0 Q 619 589.0 619 599.4 L 619 604.6 Q 619 615.0 630 615.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3"><text x="644" y="578.0" fill="#172033" font-size="15" font-weight="600">规则按生成序号从小到大匹配。</text><text x="644" y="600.0" fill="#475569" font-size="15" font-weight="400">某一条命中后停止；图按分类展示。</text></g></g></g></g></svg>

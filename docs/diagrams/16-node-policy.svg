<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title description" font-family="Arial, Microsoft YaHei, sans-serif"><title id="title">节点选择与额度 · 单向括号图</title><desc id="description">来源、服务资格、用途资格、选择机制、故障与额度分别拆解。从左向右的大括号表示整体与局部的包含关系。</desc><rect x="0" y="0" width="1280" height="700" fill="#ffffff" /><text x="28" y="32" fill="#172033" font-size="23" font-weight="600">节点选择与额度 · 单向括号图</text><text x="28" y="58" fill="#475569" font-size="14" font-weight="400">来源、服务资格、用途资格、选择机制、故障与额度分别拆解</text><text x="28" y="91" fill="#64748b" font-size="13" font-weight="400">整体</text><text x="208" y="91" fill="#64748b" font-size="13" font-weight="400">分类 / 服务组</text><text x="458" y="91" fill="#64748b" font-size="13" font-weight="400">结构拆解</text><text x="644" y="91" fill="#64748b" font-size="13" font-weight="400">完整规则 / 设计理由</text><g data-depth="0"><text x="28" y="393.0" fill="#2563eb" font-size="17" font-weight="600">订阅全部节点</text><path d="M 198 114.0 Q 187 114.0 187 126.0 L 187 381.0 Q 187 393.0 180 393.0 Q 187 393.0 187 405.0 L 187 660.0 Q 187 672.0 198 672.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="1"><text x="208" y="169.0" fill="#2563eb" font-size="17" font-weight="600">来源</text><path d="M 444 114.0 Q 433 114.0 433 126.0 L 433 157.0 Q 433 169.0 426 169.0 Q 433 169.0 433 181.0 L 433 212.0 Q 433 224.0 444 224.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="2"><text x="458" y="129.0" fill="#2563eb" font-size="17" font-weight="600">primary</text><path d="M 630 114.0 Q 619 114.0 619 120.0 L 619 123.0 Q 619 129.0 612 129.0 Q 619 129.0 619 135.0 L 619 138.0 Q 619 144.0 630 144.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3"><text x="644" y="129.0" fill="#172033" font-size="15" font-weight="600">AI 优先；普通互动备用；不承担容量自动池。</text></g></g><g data-depth="2"><text x="458" y="169.0" fill="#2563eb" font-size="17" font-weight="600">bulk</text><path d="M 630 154.0 Q 619 154.0 619 160.0 L 619 163.0 Q 619 169.0 612 169.0 Q 619 169.0 619 175.0 L 619 178.0 Q 619 184.0 630 184.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3"><text x="644" y="169.0" fill="#172033" font-size="15" font-weight="600">AI 备用、普通互动主力、下载容量。</text></g></g><g data-depth="2"><text x="458" y="209.0" fill="#2563eb" font-size="17" font-weight="600">temporary</text><path d="M 630 194.0 Q 619 194.0 619 200.0 L 619 203.0 Q 619 209.0 612 209.0 Q 619 209.0 619 215.0 L 619 218.0 Q 619 224.0 630 224.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3"><text x="644" y="209.0" fill="#172033" font-size="15" font-weight="600">仅手动目录；临近到期不加入自动池。</text></g></g></g><g data-depth="1"><text x="208" y="331.0" fill="#2563eb" font-size="17" font-weight="600">服务资格</text><path d="M 444 234.0 Q 433 234.0 433 246.0 L 433 319.0 Q 433 331.0 426 331.0 Q 433 331.0 433 343.0 L 433 416.0 Q 433 428.0 444 428.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="2"><text x="458" y="249.0" fill="#2563eb" font-size="17" font-weight="600">qualified 与日期</text><path d="M 630 234.0 Q 619 234.0 619 240.0 L 619 243.0 Q 619 249.0 612 249.0 Q 619 249.0 619 255.0 L 619 258.0 Q 619 264.0 630 264.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3"><text x="644" y="249.0" fill="#172033" font-size="15" font-weight="600">真实测量后填写；未验收节点留手动目录。</text></g></g><g data-depth="2"><text x="458" y="289.0" fill="#2563eb" font-size="17" font-weight="600">multiplier ≤ 1</text><path d="M 630 274.0 Q 619 274.0 619 280.0 L 619 283.0 Q 619 289.0 612 289.0 Q 619 289.0 619 295.0 L 619 298.0 Q 619 304.0 630 304.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3"><text x="644" y="289.0" fill="#172033" font-size="15" font-weight="600">自动池的成本门槛；不能将真实 5 倍率填成 1。</text></g></g><g data-depth="2"><text x="458" y="340.0" fill="#2563eb" font-size="17" font-weight="600">services</text><path d="M 630 314.0 Q 619 314.0 619 324.4 L 619 329.6 Q 619 340.0 612 340.0 Q 619 340.0 619 350.4 L 619 355.6 Q 619 366.0 630 366.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3"><text x="644" y="329.0" fill="#172033" font-size="15" font-weight="600">按服务 ID 列出资格，正式配置禁止 *。</text><text x="644" y="351.0" fill="#475569" font-size="15" font-weight="400">一个节点通过多项后可进入多个服务池。</text></g></g><g data-depth="2"><text x="458" y="402.0" fill="#2563eb" font-size="17" font-weight="600">roles</text><path d="M 630 376.0 Q 619 376.0 619 386.4 L 619 391.6 Q 619 402.0 612 402.0 Q 619 402.0 619 412.4 L 619 417.6 Q 619 428.0 630 428.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3"><text x="644" y="391.0" fill="#172033" font-size="15" font-weight="600">interactive 决定互动资格，bulk 决定容量资格。</text><text x="644" y="413.0" fill="#475569" font-size="15" font-weight="400">用途资格与 AI 服务资格分别填写。</text></g></g></g><g data-depth="1"><text x="208" y="504.0" fill="#2563eb" font-size="17" font-weight="600">选择机制</text><path d="M 444 438.0 Q 433 438.0 433 450.0 L 433 492.0 Q 433 504.0 426 504.0 Q 433 504.0 433 516.0 L 433 558.0 Q 433 570.0 444 570.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="2"><text x="458" y="464.0" fill="#2563eb" font-size="17" font-weight="600">自动服务</text><path d="M 630 438.0 Q 619 438.0 619 448.4 L 619 453.6 Q 619 464.0 612 464.0 Q 619 464.0 619 474.4 L 619 479.6 Q 619 490.0 630 490.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3"><text x="644" y="453.0" fill="#172033" font-size="15" font-weight="600">每个服务与来源独立 provider 检查。</text><text x="644" y="475.0" fill="#475569" font-size="15" font-weight="400">同来源沿 nodes 顺序排列；fallback 按顺序选可用候选。</text></g></g><g data-depth="2"><text x="458" y="515.0" fill="#2563eb" font-size="17" font-weight="600">手动 AI</text><path d="M 630 500.0 Q 619 500.0 619 506.0 L 619 509.0 Q 619 515.0 612 515.0 Q 619 515.0 619 521.0 L 619 524.0 Q 619 530.0 630 530.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3"><text x="644" y="515.0" fill="#172033" font-size="15" font-weight="600">select 选择逐服务合格、低倍率候选。</text></g></g><g data-depth="2"><text x="458" y="555.0" fill="#2563eb" font-size="17" font-weight="600">没有合格候选</text><path d="M 630 540.0 Q 619 540.0 619 546.0 L 619 549.0 Q 619 555.0 612 555.0 Q 619 555.0 619 561.0 L 619 564.0 Q 619 570.0 630 570.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3"><text x="644" y="555.0" fill="#172033" font-size="15" font-weight="600">select 仅包含 REJECT；用户所需业务不能据此宣布可用。</text></g></g></g><g data-depth="1"><text x="208" y="626.0" fill="#2563eb" font-size="17" font-weight="600">故障与额度</text><path d="M 444 580.0 Q 433 580.0 433 592.0 L 433 614.0 Q 433 626.0 426 626.0 Q 433 626.0 433 638.0 L 433 660.0 Q 433 672.0 444 672.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="2"><text x="458" y="595.0" fill="#2563eb" font-size="17" font-weight="600">备用切换</text><path d="M 630 580.0 Q 619 580.0 619 586.0 L 619 589.0 Q 619 595.0 612 595.0 Q 619 595.0 619 601.0 L 619 604.0 Q 619 610.0 630 610.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3"><text x="644" y="595.0" fill="#172033" font-size="15" font-weight="600">只影响新连接；既有连接需单独处理。</text></g></g><g data-depth="2"><text x="458" y="646.0" fill="#2563eb" font-size="17" font-weight="600">block-primary</text><path d="M 630 620.0 Q 619 620.0 619 630.4 L 619 635.6 Q 619 646.0 612 646.0 Q 619 646.0 619 656.4 L 619 661.6 Q 619 672.0 630 672.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3"><text x="644" y="635.0" fill="#172033" font-size="15" font-weight="600">移除主来源自动候选和手动目录；需重建、部署。</text><text x="644" y="657.0" fill="#475569" font-size="15" font-weight="400">公开生成器没有自动账单监控。</text></g></g></g></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="606" viewBox="0 0 1280 606" role="img" aria-labelledby="title description" font-family="Arial, Microsoft YaHei, sans-serif"><title id="title">GitHub 文件 · 完整规则</title><desc id="description">7 条规则；编号对应实际首匹配顺序；大括号只表示结构包含。从左向右的大括号表示整体与局部的包含关系。</desc><rect x="0" y="0" width="1280" height="606" fill="#ffffff" /><text x="28" y="32" fill="#172033" font-size="23" font-weight="600">GitHub 文件 · 完整规则</text><text x="28" y="58" fill="#475569" font-size="14" font-weight="400">7 条规则；编号对应实际首匹配顺序；大括号只表示结构包含</text><text x="28" y="91" fill="#64748b" font-size="13" font-weight="400">整体</text><text x="208" y="91" fill="#64748b" font-size="13" font-weight="400">分类 / 服务组</text><text x="458" y="91" fill="#64748b" font-size="13" font-weight="400">结构拆解</text><text x="644" y="91" fill="#64748b" font-size="13" font-weight="400">完整规则 / 设计理由</text><g data-depth="0"><text x="28" y="346.0" fill="#2563eb" font-size="17" font-weight="600">GitHub 文件</text><path d="M 198 114.0 Q 187 114.0 187 126.0 L 187 334.0 Q 187 346.0 180 346.0 Q 187 346.0 187 358.0 L 187 566.0 Q 187 578.0 198 578.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="1"><text x="208" y="313.0" fill="#2563eb" font-size="17" font-weight="600">GitHub 文件</text><text x="208" y="335.0" fill="#475569" font-size="15" font-weight="400">仅 bulk 容量候选</text><text x="208" y="357.0" fill="#475569" font-size="15" font-weight="400">已验收；倍率 ≤ 1</text><text x="208" y="379.0" fill="#475569" font-size="15" font-weight="400">roles: bulk</text><path d="M 444 114.0 Q 433 114.0 433 126.0 L 433 334.0 Q 433 346.0 426 346.0 Q 433 346.0 433 358.0 L 433 566.0 Q 433 578.0 444 578.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="2"><text x="458" y="129.0" fill="#2563eb" font-size="17" font-weight="600">设计理由</text><path d="M 630 114.0 Q 619 114.0 619 120.0 L 619 123.0 Q 619 129.0 612 129.0 Q 619 129.0 619 135.0 L 619 138.0 Q 619 144.0 630 144.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3"><text x="644" y="129.0" fill="#172033" font-size="15" font-weight="600">Raw、源码、Releases 与对象资源采用容量来源，保护 AI 额度。</text></g></g><g data-depth="2"><text x="458" y="324.0" fill="#2563eb" font-size="17" font-weight="600">精确域名 · 6 条</text><text x="458" y="346.0" fill="#475569" font-size="15" font-weight="400">DOMAIN</text><path d="M 630 154.0 Q 619 154.0 619 166.0 L 619 323.0 Q 619 335.0 612 335.0 Q 619 335.0 619 347.0 L 619 504.0 Q 619 516.0 630 516.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3" data-rule-index="10" data-rule="DOMAIN,raw.githubusercontent.com,GitHub 文件"><title>DOMAIN,raw.githubusercontent.com,GitHub 文件</title><text x="644" y="169.0" fill="#172033" font-size="15" font-weight="600">#010 raw.githubusercontent.com</text><text x="644" y="191.0" fill="#475569" font-size="15" font-weight="400">理由：Raw 文件精确分流，避免使用 AI 主订阅。</text></g><g data-depth="3" data-rule-index="11" data-rule="DOMAIN,codeload.github.com,GitHub 文件"><title>DOMAIN,codeload.github.com,GitHub 文件</title><text x="644" y="231.0" fill="#172033" font-size="15" font-weight="600">#011 codeload.github.com</text><text x="644" y="253.0" fill="#475569" font-size="15" font-weight="400">理由：仅匹配此主机，位于普通父域之前。</text></g><g data-depth="3" data-rule-index="12" data-rule="DOMAIN,objects.githubusercontent.com,GitHub 文件"><title>DOMAIN,objects.githubusercontent.com,GitHub 文件</title><text x="644" y="293.0" fill="#172033" font-size="15" font-weight="600">#012 objects.githubusercontent.com</text><text x="644" y="315.0" fill="#475569" font-size="15" font-weight="400">理由：仅匹配此主机，位于普通父域之前。</text></g><g data-depth="3" data-rule-index="13" data-rule="DOMAIN,release-assets.githubusercontent.com,GitHub 文件"><title>DOMAIN,release-assets.githubusercontent.com,GitHub 文件</title><text x="644" y="355.0" fill="#172033" font-size="15" font-weight="600">#013 release-assets.githubusercontent.com</text><text x="644" y="377.0" fill="#475569" font-size="15" font-weight="400">理由：仅匹配此主机，位于普通父域之前。</text></g><g data-depth="3" data-rule-index="14" data-rule="DOMAIN,github-releases.githubusercontent.com,GitHub 文件"><title>DOMAIN,github-releases.githubusercontent.com,GitHub 文件</title><text x="644" y="417.0" fill="#172033" font-size="15" font-weight="600">#014 github-releases.githubusercontent.com</text><text x="644" y="439.0" fill="#475569" font-size="15" font-weight="400">理由：仅匹配此主机，位于普通父域之前。</text></g><g data-depth="3" data-rule-index="15" data-rule="DOMAIN,avatars.githubusercontent.com,GitHub 文件"><title>DOMAIN,avatars.githubusercontent.com,GitHub 文件</title><text x="644" y="479.0" fill="#172033" font-size="15" font-weight="600">#015 avatars.githubusercontent.com</text><text x="644" y="501.0" fill="#475569" font-size="15" font-weight="400">理由：仅匹配此主机，位于普通父域之前。</text></g></g><g data-depth="2"><text x="458" y="541.0" fill="#2563eb" font-size="17" font-weight="600">域名后缀 · 1 条</text><text x="458" y="563.0" fill="#475569" font-size="15" font-weight="400">DOMAIN-SUFFIX</text><path d="M 630 526.0 Q 619 526.0 619 536.4 L 619 541.6 Q 619 552.0 612 552.0 Q 619 552.0 619 562.4 L 619 567.6 Q 619 578.0 630 578.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3" data-rule-index="123" data-rule="DOMAIN-SUFFIX,githubusercontent.com,GitHub 文件"><title>DOMAIN-SUFFIX,githubusercontent.com,GitHub 文件</title><text x="644" y="541.0" fill="#172033" font-size="15" font-weight="600">#123 githubusercontent.com</text><text x="644" y="563.0" fill="#475569" font-size="15" font-weight="400">理由：匹配本域与子域；精确例外先匹配。</text></g></g></g></g></svg>

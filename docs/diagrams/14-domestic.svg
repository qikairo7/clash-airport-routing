<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1288" viewBox="0 0 1280 1288" role="img" aria-labelledby="title description" font-family="Arial, Microsoft YaHei, sans-serif"><title id="title">国内域名直连 · 完整规则</title><desc id="description">18 条规则；编号对应实际首匹配顺序；大括号只表示结构包含。从左向右的大括号表示整体与局部的包含关系。</desc><rect x="0" y="0" width="1280" height="1288" fill="#ffffff" /><text x="28" y="32" fill="#172033" font-size="23" font-weight="600">国内域名直连 · 完整规则</text><text x="28" y="58" fill="#475569" font-size="14" font-weight="400">18 条规则；编号对应实际首匹配顺序；大括号只表示结构包含</text><text x="28" y="91" fill="#64748b" font-size="13" font-weight="400">整体</text><text x="208" y="91" fill="#64748b" font-size="13" font-weight="400">分类 / 服务组</text><text x="458" y="91" fill="#64748b" font-size="13" font-weight="400">结构拆解</text><text x="644" y="91" fill="#64748b" font-size="13" font-weight="400">完整规则 / 设计理由</text><g data-depth="0"><text x="28" y="687.0" fill="#2563eb" font-size="17" font-weight="600">国内域名直连</text><path d="M 198 114.0 Q 187 114.0 187 126.0 L 187 675.0 Q 187 687.0 180 687.0 Q 187 687.0 187 699.0 L 187 1248.0 Q 187 1260.0 198 1260.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="1"><text x="208" y="676.0" fill="#2563eb" font-size="17" font-weight="600">DIRECT</text><text x="208" y="698.0" fill="#475569" font-size="15" font-weight="400">DIRECT：不经过机场候选</text><path d="M 444 114.0 Q 433 114.0 433 126.0 L 433 675.0 Q 433 687.0 426 687.0 Q 433 687.0 433 699.0 L 433 1248.0 Q 433 1260.0 444 1260.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="2"><text x="458" y="129.0" fill="#2563eb" font-size="17" font-weight="600">设计理由</text><path d="M 630 114.0 Q 619 114.0 619 120.0 L 619 123.0 Q 619 129.0 612 129.0 Q 619 129.0 619 135.0 L 619 138.0 Q 619 144.0 630 144.0" fill="none" stroke="#2563eb" stroke-width="1.8" data-brace="true" /><g data-depth="3"><text x="644" y="129.0" fill="#172033" font-size="15" font-weight="600">回环、局域网与明确国